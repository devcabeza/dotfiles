gui:
  mouseEvents: false
  showCommandLog: true
  showFileIcons: true
  showListFooter: true
  theme:
    activeBorderColor:
      - '#cba6f7'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
      - bold
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#cba6f7'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
git:
  autoFetch: true
  skipHookPrefix: WIP
  ignoreWhitespaceInDiffView: true
os:
  editPreset: 'nvim'
  edit: "nvim --server $NVIM --remote-tab {{filename}}"

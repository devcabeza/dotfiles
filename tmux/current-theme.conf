# Catppuccin Mocha Theme for Tmux
set -g status-justify "left"
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left "#[fg=#1e1e2e,bg=#b4befe,bold] #S #[fg=#b4befe,bg=#1e1e2e,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#45475a,bg=#1e1e2e,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#45475a] %Y-%m-%d  %H:%M #[fg=#cba6f7,bg=#45475a,nobold,nounderscore,noitalics]#[fg=#11111b,bg=#cba6f7,bold] #h "

setw -g window-status-activity-style "underscore,fg=#bac2de,bg=#1e1e2e"
setw -g window-status-separator ""
setw -g window-status-style "fg=#a6adc8,bg=#1e1e2e"
setw -g window-status-format "#[fg=#1e1e2e,bg=#1e1e2e,nobold,nounderscore,noitalics]#[default] #I  #W #[fg=#1e1e2e,bg=#1e1e2e,nobold,nounderscore,noitalics]"
setw -g window-status-current-style "fg=#cdd6f4,bg=#313244"
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#313244,nobold,nounderscore,noitalics]#[fg=#cdd6f4,bg=#313244,bold] #I  #W #[fg=#313244,bg=#1e1e2e,nobold,nounderscore,noitalics]"
